<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" fill="none">
  <defs>
    <linearGradient id="bgGrad" x1="0" y1="0" x2="512" y2="512" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#0f172a" />
      <stop offset="50%" stop-color="#1e1b4b" />
      <stop offset="100%" stop-color="#312e81" />
    </linearGradient>
    <linearGradient id="accentGrad" x1="120" y1="120" x2="380" y2="380" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#6366f1" />
      <stop offset="50%" stop-color="#38bdf8" />
      <stop offset="100%" stop-color="#4f46e5" />
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="16" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>
  <!-- Base Background Squircle -->
  <rect width="512" height="512" rx="128" fill="url(#bgGrad)" />
  <rect x="8" y="8" width="496" height="496" rx="120" stroke="#4f46e5" stroke-opacity="0.3" stroke-width="6" />

  <!-- Stylized Geometric B & POS Cart / Register Sync Elements -->
  <g transform="translate(100, 96)">
    <!-- Main stem -->
    <rect x="20" y="24" width="48" height="272" rx="24" fill="url(#accentGrad)" filter="url(#glow)" />
    <!-- Top loop -->
    <path d="M44 24 H180 C235 24 280 64 280 120 C280 176 235 216 180 216 H44 Z" fill="none" stroke="url(#accentGrad)" stroke-width="44" stroke-linecap="round" stroke-linejoin="round" />
    <!-- Bottom loop -->
    <path d="M44 176 H196 C256 176 304 216 304 272 C304 328 256 368 196 368 H44" fill="none" stroke="url(#accentGrad)" stroke-width="44" stroke-linecap="round" stroke-linejoin="round" />
    <!-- Scan beam / sync pulse -->
    <line x1="20" y1="160" x2="330" y2="160" stroke="#38bdf8" stroke-width="8" stroke-linecap="round" stroke-dasharray="16 12" opacity="0.9" />
    <circle cx="280" cy="120" r="14" fill="#38bdf8" />
    <circle cx="304" cy="272" r="14" fill="#6366f1" />
  </g>
</svg>
